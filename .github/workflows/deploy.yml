name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Gate for both deploy jobs: a broken calcPL or import path must not reach
  # production just because the suite was only ever run locally.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run logic regression suite
        run: node --test tests/logic.test.mjs

  deploy:
    needs: test
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Inject Supabase credentials from GitHub Secrets into dashboard.html
      # The source file contains __SUPABASE_URL__ and __SUPABASE_ANON__ placeholders
      # — no real keys ever appear in the git repository
      - name: Inject Supabase config
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.SUPABASE_URL }}|g" dashboard.html
          sed -i "s|__SUPABASE_ANON__|${{ secrets.SUPABASE_ANON_KEY }}|g" dashboard.html
          sed -i "s|tj-v[0-9]*|tj-$(git rev-parse --short HEAD)|g" sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-functions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest": resolving "latest" costs an unauthenticated
          # GitHub releases API call from a shared runner IP, which failed the
          # sibling stock-screener deploy twice on 2026-08-23 with "rate limit
          # exceeded", including on a re-run. Bump this deliberately.
          version: 2.115.0

      # A function directory with no deploy line below is invisible: the job
      # still goes green while that function stays frozen at whatever version
      # was last pushed by hand. ibkr-cron sat like that from 2026-08-09 to
      # 2026-08-26. The comment in the deploy step is not enough on its own —
      # this makes the omission physically fail the build.
      - name: Every function is in the deploy list
        run: |
          missing=0
          for d in supabase/functions/*/; do
            name=$(basename "$d")
            case "$name" in _*) continue;; esac
            if ! grep -q "functions deploy $name " .github/workflows/deploy.yml; then
              echo "::error::supabase/functions/$name has no deploy line in deploy.yml"
              missing=1
            fi
          done
          exit $missing

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy edgar       --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy finnhub     --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy ibkr        --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy fmp         --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy alphavantage --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy coingecko   --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy fear-greed        --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy crypto-fear-greed --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy theme-tracker     --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy sector-holdings   --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy bybit             --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy bybit-cron        --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy fx                --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          # These three were missing from this list until 2026-08-26 and so had
          # NEVER been deployed by CI — a green deploy-functions job meant
          # nothing for them. Found when a change to ibkr-cron (the main IBKR
          # sync) reported success but the live function was still a version
          # from 2026-08-09. Every function directory under supabase/functions
          # belongs here; adding a new one means adding a line here too.
          supabase functions deploy ibkr-cron         --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy ibkr-alert        --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy push-daily        --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
          supabase functions deploy personal-stem     --project-ref fnklrqxwyeibfptaxewf --no-verify-jwt
